<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artemis II</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="landing">
    <!-- LAYER LUAR ANGKASA (Bintang & Bulan) -->
    <div id="spaceContainer">
        <svg id="spaceSvg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#F8FAFC" />
                    <stop offset="70%" stop-color="#CBD5E1" />
                    <stop offset="100%" stop-color="#64748B" />
                </radialGradient>
                <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.25" />
                    <stop offset="100%" stop-color="#020814" stop-opacity="0" />
                </radialGradient>
                <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" />
                </filter>
            </defs>

            <!-- LAYER 1: Bintang Jauh -->
            <g id="layerDistantStars" class="star-layer">
                <circle cx="250" cy="180" r="1" fill="#FFFFFF" opacity="0.3" class="twinkle-slow" />
                <circle cx="520" cy="120" r="1.5" fill="#93C5FD" opacity="0.4" class="twinkle-delayed" />
                <circle cx="840" cy="220" r="1" fill="#FFFFFF" opacity="0.25" class="twinkle-slow" />
                <circle cx="1150" cy="150" r="1.2" fill="#FFFFFF" opacity="0.35" class="twinkle-fast" />
                <circle cx="1450" cy="280" r="1" fill="#93C5FD" opacity="0.3" class="twinkle-delayed" />
                <circle cx="1720" cy="130" r="1.5" fill="#FFFFFF" opacity="0.2" class="twinkle-slow" />
                
                <circle cx="180" cy="480" r="1.2" fill="#FFFFFF" opacity="0.3" class="twinkle-fast" />
                <circle cx="430" cy="550" r="1" fill="#FFFFFF" opacity="0.2" class="twinkle-slow" />
                <circle cx="760" cy="420" r="1.5" fill="#93C5FD" opacity="0.35" class="twinkle-delayed" />
                <circle cx="1080" cy="510" r="1" fill="#FFFFFF" opacity="0.25" class="twinkle-slow" />
                <circle cx="1380" cy="460" r="1.2" fill="#FFFFFF" opacity="0.3" class="twinkle-fast" />
                <circle cx="1650" cy="530" r="1" fill="#93C5FD" opacity="0.4" class="twinkle-delayed" />

                <circle cx="310" cy="820" r="1" fill="#FFFFFF" opacity="0.3" class="twinkle-delayed" />
                <circle cx="650" cy="780" r="1.5" fill="#FFFFFF" opacity="0.25" class="twinkle-slow" />
                <circle cx="920" cy="850" r="1" fill="#93C5FD" opacity="0.35" class="twinkle-fast" />
                <circle cx="1240" cy="790" r="1.2" fill="#FFFFFF" opacity="0.2" class="twinkle-slow" />
                <circle cx="1580" cy="840" r="1" fill="#FFFFFF" opacity="0.3" class="twinkle-delayed" />
            </g>

            <!-- LAYER 2: Bulan NASA Style -->
            <g id="layerMoon" class="moon-group">
                <circle cx="0" cy="0" r="160" fill="url(#moonGlow)" />
                <circle cx="0" cy="0" r="95" fill="url(#moonGrad)" />
                <g opacity="0.12" filter="url(#softBlur)">
                    <ellipse cx="-25" cy="-30" rx="18" ry="12" fill="#334155" transform="rotate(-15 -25 -30)" />
                    <circle cx="35" cy="15" r="22" fill="#334155" />
                    <ellipse cx="-15" cy="40" rx="28" ry="16" fill="#334155" transform="rotate(20 -15 40)" />
                    <circle cx="20" cy="-45" r="12" fill="#334155" />
                </g>
            </g>

            <!-- LAYER 3: Bintang Foreground (Dekat) -->
            <g id="layerForegroundStars" class="star-layer">
                <circle cx="380" cy="250" r="1.8" fill="#FFFFFF" opacity="0.6" class="twinkle-delayed" />
                <circle cx="980" cy="180" r="2" fill="#E0F2FE" opacity="0.65" class="twinkle-fast" />
                <circle cx="1520" cy="380" r="1.8" fill="#FFFFFF" opacity="0.55" class="twinkle-slow" />
                <circle cx="220" cy="720" r="2" fill="#E0F2FE" opacity="0.5" class="twinkle-slow" />
                <circle cx="810" cy="680" r="1.8" fill="#FFFFFF" opacity="0.6" class="twinkle-fast" />
                <circle cx="1450" cy="750" r="2" fill="#FFFFFF" opacity="0.55" class="twinkle-delayed" />
            </g>
        </svg>
    </div>

    <!-- KONTEN UTAMA (Teks & Roket) -->
    <div class="content">
        <p class="small-title">GRADUATION MISSION</p>
        <h1>Untuk Farahdhyba 🌷</h1>
        
        <button id="launchButton"> Launch Artemis II</button>
        <h2 id="countdown"></h2>
        
        <div id="rocketContainer">
            <!-- Asap Bertahap -->
            <div class="smoke-cloud smoke-left"></div>
            <div class="smoke-cloud smoke-right"></div>
            <div class="smoke-cloud smoke-nozzle"></div>
            
            <!-- Vektor Roket Minimalis -->
            <svg id="rocket" width="100" height="160" viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">
                <g id="flameGroup">
                    <path class="flame-main" d="M 40 120 Q 50 170 60 120 Z" fill="#ff9d00"/>
                    <path class="flame-core" d="M 45 120 Q 50 145 55 120 Z" fill="#ffea00"/>
                </g>
                <path d="M 50 40 L 20 110 L 30 110 L 50 80 Z" fill="#dce1e6"/>
                <path d="M 50 40 L 80 110 L 70 110 L 50 80 Z" fill="#dce1e6"/>
                <path d="M 50 10 C 35 30 30 60 30 110 L 70 110 C 70 60 65 30 50 10 Z" fill="#ffffff"/>
                <path d="M 50 10 C 60 25 70 60 70 110 L 65 110 C 65 65 57 30 50 10 Z" fill="#f0f2f5"/>
                <circle cx="50" cy="50" r="10" fill="#1d3d7a"/>
                <circle cx="48" cy="48" r="4" fill="#8aa6d9"/> 
                <path d="M 35 110 L 65 110 L 60 120 L 40 120 Z" fill="#2c3e50"/>
            </svg>
        </div>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
