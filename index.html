<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artemis II</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<section id="landing">

    <div class="content">

        <p class="small-title">
            GRADUATION MISSION
        </p>

        <h1>
            Untuk Farahdhyba 🌷
        </h1>
        <button id="launchButton">
    🚀 Launch Artemis II
</button>

<h2 id="countdown"></h2>

<div id="rocketContainer">

    <svg id="rocket" width="80" height="120" viewBox="0 0 80 120">

        <!-- Badan -->
        <rect x="30" y="20" width="20" height="50" fill="white"/>

        <!-- Kepala -->
        <polygon points="40,0 28,20 52,20" fill="white"/>

        <!-- Sayap kiri -->
        <polygon points="30,60 18,72 30,72" fill="#d0d0d0"/>

        <!-- Sayap kanan -->
        <polygon points="50,60 62,72 50,72" fill="#d0d0d0"/>

        <!-- Jendela -->
        <rect x="36" y="32" width="8" height="8" fill="#5bc0ff"/>

        <!-- Api -->
        <polygon id="flame"
            points="40,70 34,84 40,96 46,84"
            fill="orange"/>

    </svg>

</div>
        </section>

<script src="script.js"></script>

</body>

</html>
