<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artemis II</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<section id="landing">

    <div class="content">

        <p class="small-title">
            GRADUATION MISSION
        </p>

        <h1>
            Untuk Farahdhyba 🌷
        </h1>
        <button id="launchButton">
    🚀 Launch Artemis II
</button>

<h2 id="countdown"></h2>

<div id="rocketContainer">
    <!-- Asap Pixel (Muncul saat liftoff) -->
    <div class="smoke smoke-left"></div>
    <div class="smoke smoke-right"></div>
    <div class="smoke smoke-bottom"></div>

    <!-- Roket Pixel Art Modern -->
    <svg id="rocket" width="120" height="160" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        
        <!-- Moncong Roket -->
        <rect x="50" y="10" width="20" height="10" fill="#e0e0e0"/>
        <rect x="40" y="20" width="40" height="10" fill="#f5f5f5"/>
        
        <!-- Badan Roket -->
        <rect x="40" y="30" width="40" height="60" fill="#ffffff"/>
        
        <!-- Jendela Kaca Biru -->
        <rect x="50" y="40" width="20" height="20" fill="#4a90e2"/>
        <rect x="55" y="45" width="5" height="5" fill="#8fd3fe"/> 
        
        <!-- Sayap Kiri (Merah) -->
        <rect x="30" y="60" width="10" height="10" fill="#ff4757"/>
        <rect x="20" y="70" width="20" height="20" fill="#ff4757"/>
        
        <!-- Sayap Kanan (Merah) -->
        <rect x="80" y="60" width="10" height="10" fill="#ff4757"/>
        <rect x="80" y="70" width="20" height="20" fill="#ff4757"/>
        
        <!-- Mesin Bawah (Abu-abu & Hitam) -->
        <rect x="40" y="90" width="40" height="10" fill="#747d8c"/>
        <rect x="50" y="100" width="20" height="10" fill="#2f3542"/>

        <!-- Api Pixel (Group) -->
        <g id="flameGroup">
            <!-- Api Luar (Kuning) -->
            <rect class="flame-outer" x="40" y="110" width="40" height="20" fill="#ffa502"/>
            <rect class="flame-outer" x="50" y="130" width="20" height="10" fill="#ffa502"/>
            <!-- Api Dalam (Oranye) -->
            <rect class="flame-inner" x="50" y="110" width="20" height="15" fill="#ff7f50"/>
            <rect class="flame-inner" x="55" y="125" width="10" height="10" fill="#ff7f50"/>
            <!-- Inti Api (Kuning Terang) -->
            <rect class="flame-core" x="55" y="110" width="10" height="10" fill="#ffdda1"/>
        </g>
    </svg>
</div>
        </section>

<script src="script.js"></script>

</body>

</html>
